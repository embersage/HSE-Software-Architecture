name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Сборка проекта начата
        run: echo "Build is running..."

      - name: Сборка клиента
        run: |
          echo "client building..."
        working-directory: ./Lab\ Work\ №5/code/client

      - name: Сборка маршрутизатора
        run: |
          echo "gateway building..."
        working-directory: ./Lab\ Work\ №5/code/gateway

      - name: Сборка сервиса постов
        run: |
          echo "post-service building..."
        working-directory: ./Lab\ Work\ №5/code/post-service

      - name: Сборка сервиса пользователей
        run: |
          echo "user-service successfully!"
        working-directory: ./Lab\ Work\ №5/code/user-service

      - name: Сборка проекта закончена
        run: echo "Build completed successfully!"

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Деплой проекта начат
        run: echo "Deployment is running..."

      - name: Создание папки
        run: mkdir -p blog-app

      - name: Копирование docker-compose
        run: cp docker-compose.yml blog-app/

      - name: Смена директории в blog-app
        run: |
          cd blog-app
          docker-compose down
          docker-compose up -d

      - name: Деплой проекта закончен
        run: echo "Deployment completed successfully!"
