name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd Lab\ Work\ №5/code/client && npm install
          cd ../gateway && npm install
          cd ../post-service && npm install
          cd ../user-service && npm install

      - name: Build Services
        run: |
          cd Lab\ Work\ №5/code/client && npm run build
          cd ../gateway && npm run build
          cd ../post-service && npm run build
          cd ../user-service && npm run build

  deploy:
    name: Deploy to DockerHub
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

      - name: Build and Push Docker Images
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/client:latest ./Lab\ Work\ №5/code/client
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/gateway:latest ./Lab\ Work\ №5/code/gateway
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/post-service:latest ./Lab\ Work\ №5/code/post-service
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest ./Lab\ Work\ №5/code/user-service
          
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/client:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gateway:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/post-service:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/user-service:latest
