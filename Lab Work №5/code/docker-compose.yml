version: '3'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - '8001:3000'
    environment:
      REACT_APP_API_URL: http://localhost:8002
    depends_on:
    - server
    restart: always

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '8002:5000'
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: root
      DB_NAME: blog_db
      SECRET_KEY: Javascript is awesome
    depends_on:
    - postgres
    restart: always

  postgres:
    image: postgres:latest
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: blog_db
    ports:
      - '8003:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: